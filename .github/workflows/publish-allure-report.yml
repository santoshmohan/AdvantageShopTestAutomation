name: Publish Allure Report to GitHub Pages

on:
  workflow_run:
    workflows: ["Daily Test Execution with Allure Report"]
    types: [completed]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download Allure Report Artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: allure-report-Production
          path: ./report-download

      - name: Extract and prepare report
        run: |
          echo "=== Preparing Allure Report ==="
          
          # Remove old report
          rm -rf allure-report-Production
          mkdir -p allure-report-Production
          
          # Check if report files exist in download directory
          if [ -d "report-download" ] && [ "$(ls -A report-download)" ]; then
            echo "✓ Report files found in report-download"
            
            # Check if files are directly in report-download or nested
            if [ -f "report-download/index.html" ]; then
              echo "✓ Files are directly in report-download - copying..."
              cp -r report-download/* allure-report-Production/
            else
              # Files might be in a nested folder
              echo "⚠ Files appear to be nested - attempting to flatten..."
              find report-download -type f -name "*.html" -o -name "*.json" -o -name "*.css" -o -name "*.js" | while read file; do
                mkdir -p "allure-report-Production/$(dirname "$file" | sed 's|report-download/||')"
                cp "$file" "allure-report-Production/$(dirname "$file" | sed 's|report-download/||')/$(basename "$file")"
              done
            fi
            
            rm -rf report-download
          else
            echo "✗ No report files found - creating placeholder"
            mkdir -p allure-report-Production
          fi
          
          echo ""
          echo "=== Report Directory Contents ==="
          if [ -f "allure-report-Production/index.html" ]; then
            echo "✓ index.html exists"
            ls -la allure-report-Production/ | head -20
          else
            echo "⚠ index.html not found"
            find allure-report-Production -type f | head -20
          fi

      - name: Create index page
        run: |
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Allure Test Reports</title>
            <style>
              * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
              }
              
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
              }
              
              .container {
                background: white;
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                max-width: 600px;
                width: 100%;
              }
              
              h1 {
                color: #333;
                margin-bottom: 10px;
                font-size: 28px;
              }
              
              .subtitle {
                color: #666;
                margin-bottom: 30px;
                font-size: 14px;
              }
              
              .report-section {
                background: #f6f8fa;
                padding: 20px;
                border-radius: 8px;
                margin-bottom: 20px;
              }
              
              .report-section h2 {
                color: #0366d6;
                font-size: 16px;
                margin-bottom: 15px;
              }
              
              .btn {
                display: inline-block;
                padding: 12px 24px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-weight: 600;
                transition: transform 0.2s, box-shadow 0.2s;
                margin-bottom: 10px;
              }
              
              .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
              }
              
              .info-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                margin-top: 20px;
              }
              
              .info-item {
                background: white;
                padding: 12px;
                border-radius: 6px;
                border-left: 4px solid #0366d6;
              }
              
              .info-item strong {
                display: block;
                color: #0366d6;
                font-size: 12px;
                margin-bottom: 4px;
              }
              
              .info-item span {
                color: #333;
                font-size: 14px;
              }
              
              .footer {
                margin-top: 30px;
                padding-top: 20px;
                border-top: 1px solid #e1e4e8;
                color: #666;
                font-size: 12px;
                text-align: center;
              }
              
              .badge {
                display: inline-block;
                background: #28a745;
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                font-weight: bold;
                margin-left: 10px;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>📊 Test Reports <span class="badge">LIVE</span></h1>
              <p class="subtitle">AdvantageShopTestAutomation - Continuous Integration Reports</p>
              
              <div class="report-section">
                <h2>Latest Allure Report</h2>
                <p>Click below to view the detailed test execution report with metrics, timeline, and test results.</p>
                <a href="./allure-report-Production/index.html" class="btn">
                  📈 View Allure Report
                </a>
              </div>
              
              <div class="info-grid">
                <div class="info-item">
                  <strong>Environment</strong>
                  <span>Production</span>
                </div>
                <div class="info-item">
                  <strong>Browser</strong>
                  <span>Firefox</span>
                </div>
                <div class="info-item">
                  <strong>Mode</strong>
                  <span>Headless ✓</span>
                </div>
                <div class="info-item">
                  <strong>Last Updated</strong>
                  <span id="lastUpdated">-</span>
                </div>
              </div>
              
              <div class="footer">
                <p>Reports are automatically generated and published after each test run.</p>
                <p>📚 <a href="https://github.com/santoshmohan/AdvantageShopTestAutomation" style="color: #0366d6;">View Repository</a></p>
              </div>
            </div>
            
            <script>
              // Get the date from the page's last modified time
              const lastModified = new Date(document.lastModified);
              document.getElementById('lastUpdated').textContent = lastModified.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              });
            </script>
          </body>
          </html>
          EOF
          echo "✓ index.html created"

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Allure reports - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" --allow-empty
          git push origin gh-pages

      - name: Deploy status
        run: |
          echo "✅ Allure report published to GitHub Pages"
          echo "🔗 Available at: https://santoshmohan.github.io/AdvantageShopTestAutomation/"
          echo "📊 Environment: Production"
          echo "⏰ Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"