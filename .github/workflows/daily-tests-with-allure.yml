name: Daily Test Execution with Allure Report

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [Production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet restore
      
      - name: Build project
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet build --no-restore --configuration Release
      
      - name: List directory structure before tests
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "=== Directory structure BEFORE tests ==="
          ls -laR | head -100
      
      - name: Run tests against ${{ matrix.environment }} (Headless Mode)
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "Starting test execution..."
          dotnet test --no-build --configuration Release \
            --settings .runsettings/${{ matrix.environment }}.runsettings \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=TestResults-${{ matrix.environment }}.trx" \
            --results-directory "TestResults"
          echo "Test execution completed"
        continue-on-error: true
      
      - name: List directory structure after tests (full)
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "=== Full directory tree AFTER tests ==="
          find . -type d | sort
      
      - name: Search for allure-results specifically
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "=== Searching for allure-results directory ==="
          find . -type d -name "allure-results" -o -type d -name "*allure*" 2>/dev/null
          
          echo ""
          echo "=== Searching for any allure JSON files ==="
          find . -name "*.json" -path "*/allure*" 2>/dev/null | head -20
          
          echo ""
          echo "=== Current working directory ==="
          pwd
          
          echo ""
          echo "=== Root contents ==="
          ls -la
          
          echo ""
          echo "=== Bin/Release contents ==="
          ls -la bin/Release/net10.0/ 2>/dev/null || echo "Bin/Release not found"
          
          echo ""
          echo "=== Bin/Debug contents ==="
          ls -la bin/Debug/net10.0/ 2>/dev/null || echo "Bin/Debug not found"
      
      - name: Copy allure-results if in bin directory
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "=== Attempting to locate and copy allure-results ==="
          
          # Check Release bin first
          if [ -d "bin/Release/net10.0/allure-results" ]; then
            echo "✓ Found in bin/Release/net10.0"
            cp -r bin/Release/net10.0/allure-results ./allure-results-release
            ls -laR ./allure-results-release
          fi
          
          # Check Debug bin
          if [ -d "bin/Debug/net10.0/allure-results" ]; then
            echo "✓ Found in bin/Debug/net10.0"
            cp -r bin/Debug/net10.0/allure-results ./allure-results-debug
            ls -laR ./allure-results-debug
          fi
          
          # Use find as fallback
          FOUND_DIR=$(find . -type d -name "allure-results" 2>/dev/null | grep -v node_modules | head -1)
          if [ -n "$FOUND_DIR" ]; then
            echo "✓ Found at: $FOUND_DIR"
            cp -r "$FOUND_DIR" ./allure-results
            echo "✓ Copied to ./allure-results"
            ls -laR ./allure-results
          else
            echo "✗ No allure-results directory found anywhere"
          fi
      
      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline
      
      - name: Generate Allure Report
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "=== Checking for allure-results ==="
          
          if [ -d "allure-results" ]; then
            echo "✓ allure-results exists"
            RESULT_COUNT=$(find allure-results -type f | wc -l)
            echo "✓ Contains $RESULT_COUNT files"
            
            if [ "$RESULT_COUNT" -gt 0 ]; then
              echo "✓ Generating Allure report..."
              allure generate allure-results --clean -o allure-report-${{ matrix.environment }}
              echo "✓ Report generated"
            else
              echo "⚠ Directory is empty"
            fi
          elif [ -d "allure-results-release" ]; then
            echo "✓ Using allure-results-release"
            allure generate allure-results-release --clean -o allure-report-${{ matrix.environment }}
          elif [ -d "allure-results-debug" ]; then
            echo "✓ Using allure-results-debug"
            allure generate allure-results-debug --clean -o allure-report-${{ matrix.environment }}
          else
            echo "✗ No allure-results found"
            mkdir -p allure-report-${{ matrix.environment }}
          fi
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/allure-report-${{ matrix.environment }}/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/TestResults/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload allure-results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-raw-${{ github.run_number }}
          path: AdvantageShopTestAutomation/allure-results*/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Test Summary
        if: always()
        run: |
          echo "✅ Tests completed for ${{ matrix.environment }}!"
          echo "📊 Check artifacts for reports and debug info"