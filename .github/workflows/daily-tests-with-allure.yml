name: Daily Test Execution with Allure Report

on:
  schedule:
    - cron: '0 9 * * *'  # Runs daily at 9 AM UTC
  workflow_dispatch:      # Allows manual trigger
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [Production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet restore
      
      - name: Build project
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet build --no-restore --configuration Release
      
      - name: Create allure-results directory
        working-directory: ./AdvantageShopTestAutomation
        run: mkdir -p allure-results
      
      - name: Run tests against ${{ matrix.environment }} (Headless Mode)
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet test --no-build --configuration Release --settings .runsettings/${{ matrix.environment }}.runsettings --logger "console;verbosity=detailed" --logger "trx;LogFileName=TestResults-${{ matrix.environment }}.trx" --results-directory "TestResults"
        continue-on-error: true
      
      - name: Check test results directory
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "=== Checking TestResults directory ==="
          if [ -d "TestResults" ]; then
            echo "✓ TestResults directory found"
            ls -la TestResults/
          else
            echo "✗ TestResults directory NOT found"
          fi
      
      - name: Check allure-results directory
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "=== Checking allure-results directory ==="
          if [ -d "allure-results" ]; then
            echo "✓ allure-results directory found"
            if [ -z "$(ls -A allure-results)" ]; then
              echo "⚠ Directory is empty"
            else
              echo "Contents:"
              ls -la allure-results/
            fi
          else
            echo "✗ allure-results directory NOT found"
          fi
      
      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline
      
      - name: Generate Allure Report
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          if [ -d "allure-results" ] && [ -n "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "Generating Allure report..."
            allure generate allure-results --clean -o allure-report-${{ matrix.environment }}
            echo "✓ Report generated successfully"
          else
            echo "⚠ No allure-results found. Report generation skipped."
          fi
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/allure-report-${{ matrix.environment }}/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/TestResults/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Test Summary
        if: always()
        run: |
          echo "✅ Tests completed for ${{ matrix.environment }}!"
          echo "🌐 Environment: ${{ matrix.environment }}"
          echo "🌍 Browser: Firefox"
          echo "🎯 Headless Mode: Enabled ✓"
          echo "⏱️ Timeout: 25 seconds"
          echo "📊 Check artifacts for reports"