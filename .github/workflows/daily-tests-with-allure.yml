name: Daily Test Execution with Allure Report

on:
  schedule:
    - cron: '0 9 * * *'  # Runs daily at 9 AM UTC
  workflow_dispatch:      # Allows manual trigger
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [Production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet restore
      
      - name: Build project
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet build --no-restore --configuration Release
      
      - name: Create allure-results directory
        working-directory: ./AdvantageShopTestAutomation
        run: |
          mkdir -p allure-results
          echo "allure-results directory created"
      
      - name: Run tests against ${{ matrix.environment }} (Headless Mode)
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet test --no-build --configuration Release --settings .runsettings/${{ matrix.environment }}.runsettings --logger "console;verbosity=detailed" --logger "trx;LogFileName=TestResults-${{ matrix.environment }}.trx" --results-directory "TestResults"
        continue-on-error: true
      
      - name: Check allure-results directory
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          echo "Checking for allure-results directory..."
          if [ -d "allure-results" ]; then
            echo "✓ allure-results directory found"
            echo "Contents:"
            ls -la allure-results/ || echo "Directory is empty"
          else
            echo "✗ allure-results directory NOT found"
            echo "Current directory contents:"
            ls -la
          fi
      
      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline
      
      - name: Generate Allure Report for ${{ matrix.environment }}
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            echo "Generating Allure report from allure-results..."
            allure generate allure-results --clean -o allure-report-${{ matrix.environment }}
            echo "✓ Report generated successfully"
          else
            echo "⚠ No test results found in allure-results. Creating sample report..."
            mkdir -p allure-report-${{ matrix.environment }}
            cat > allure-report-${{ matrix.environment }}/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
              <title>Allure Report - No Results</title>
              <style>
                body { font-family: Arial; margin: 20px; }
                .warning { color: #ff6600; font-size: 18px; }
              </style>
            </head>
            <body>
              <h1 class="warning">⚠ No Test Results Generated</h1>
              <p>The allure-results directory is empty. This may indicate:</p>
              <ul>
                <li>Tests did not run successfully</li>
                <li>Allure.NUnit is not properly configured</li>
                <li>No tests were found</li>
              </ul>
              <p>Check the workflow logs for details.</p>
            </body>
            </html>
            EOF
          fi
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/allure-report-${{ matrix.environment }}/
          retention-days: 30
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/TestResults/
          retention-days: 30
      
      - name: Test Summary
        if: always()
        run: |
          echo "✅ Tests completed for ${{ matrix.environment }}!"
          echo "🌐 Environment: ${{ matrix.environment }}"
          echo "🌍 Browser: Firefox"
          echo "🎯 Headless Mode: Enabled ✓"
          echo "⏱️ Timeout: 25 seconds"
          echo "📊 Allure report generated"
          echo "📝 Check artifacts for detailed reports"