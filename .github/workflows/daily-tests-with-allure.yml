name: Daily Test Execution with Allure Report

on:
  schedule:
    - cron: '0 9 * * *'  # Runs daily at 9 AM UTC
  workflow_dispatch:      # Allows manual trigger
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [Development, Production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet restore
      
      - name: Build project
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet build --no-restore --configuration Release
      
      - name: Run tests against ${{ matrix.environment }}
        working-directory: ./AdvantageShopTestAutomation
        run: dotnet test --no-build --configuration Release --settings .runsettings/${{ matrix.environment }}.runsettings --logger "console;verbosity=detailed" --logger "trx;LogFileName=TestResults-${{ matrix.environment }}.trx" --results-directory "TestResults"
        continue-on-error: true
      
      - name: Install Allure Commandline
        if: always()
        run: npm install -g allure-commandline
      
      - name: Generate Allure Report for ${{ matrix.environment }}
        if: always()
        working-directory: ./AdvantageShopTestAutomation
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results --clean -o allure-report-${{ matrix.environment }}
          else
            echo "No allure-results directory found for ${{ matrix.environment }}"
          fi
      
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/allure-report-${{ matrix.environment }}/
          retention-days: 30
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.environment }}-${{ github.run_number }}
          path: AdvantageShopTestAutomation/TestResults/
          retention-days: 30
      
      - name: Test Summary
        if: always()
        run: |
          echo "✅ Tests completed for ${{ matrix.environment }}!"
          echo "📊 Allure report generated"
          echo "📝 Check artifacts for detailed reports"